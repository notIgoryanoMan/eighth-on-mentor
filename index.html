  <div class="main">
    
<div class="image-container">

            src="/HTML/nft-preview-card-component-main/images/icon-view.svg"

      <div class="tokens">
        
       <span class="eth"><img src="/HTML/nft-preview-card-component-main/images/icon-ethereum.svg" class="ether"> 0.041 ETH</span> <span class="days"><img src="/HTML/nft-preview-card-component-main/images/icon-clock.svg" alt="ClockIcon" class="clock">3 days left</span>
      </div>

      <hr>

        <div class="creation">
  <img src="/HTML/nft-preview-card-component-main/images/image-avatar.png"> <p>Creation of</p> <span>Jules Wyvern</span>
